name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js & Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Salin semua file web ke folder www
        run: |
          mkdir -p www_build
          shopt -s extglob
          cp -r !(www_build|.git|.github) www_build/ 2>/dev/null || true
          mv www_build www

      - name: Instal Capacitor & Tambahkan Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Aplikasi Saya" "com.contoh.aplikasi" --web-dir=www
          npx cap add android

      - name: Rakit (Build) file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
